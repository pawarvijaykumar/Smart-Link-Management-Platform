<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>SmartLink — Smart Link Management Platform</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('smartlink-appearance');
          var p = raw ? JSON.parse(raw) : {};
          var t = p.theme || 'dark';
          var eff = t === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          var d = document.documentElement;
          d.setAttribute('data-theme', eff);
          d.setAttribute('data-bg', p.bg || 'slate');
          d.setAttribute('data-accent', p.accent || 'indigo');
          d.setAttribute('data-density', p.density || 'comfortable');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
